<!doctype html><html lang="__LANG__"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vela</title>
<style>body{background:#111217;color:#f6f6f9;font:17px system-ui;max-width:780px;margin:32px auto;padding:20px}h1{font-weight:600}button,input,select{font:inherit;border:0;border-radius:15px;padding:15px;margin:6px 0;box-sizing:border-box}button{background:#eeeef3;color:#17181f;cursor:pointer}input,select{width:100%;background:#272832;color:white}.card{background:#1c1d25;border-radius:24px;padding:22px;margin:20px 0}.muted{color:#b2b3be}#notice{white-space:pre-wrap}label{display:block;margin:12px 0 4px}</style>
<h1>Vela</h1><p class="muted" data-i18n="Your television, your way. Temporary encrypted connection on your network."></p><p id="notice" role="status"></p>
<section class="card"><h2 data-i18n="Home"></h2><div id="rows"></div><h3 data-i18n="Folders"></h3><input id="folder" maxlength="40" data-placeholder="Folder name"><p class="muted" data-i18n="Tap an app to add or remove it from the named folder. Arrows reorder your app drawer."></p><div id="apps"></div><button onclick="load(-1)" data-i18n="Previous"></button> <button onclick="load(1)" data-i18n="Next"></button></section>
<section class="card"><h2 data-i18n="Channels"></h2><p class="muted" data-i18n="Tap to add or remove a favourite."></p><div id="channels"></div></section>
<section class="card"><h2 data-i18n="Appearance"></h2><label data-i18n="Text size"></label><select id="scale"><option value="0">100 %</option><option value="1">115 %</option><option value="2">130 %</option></select><button onclick="saveReading()" data-i18n="Save text size"></button></section>
<section class="card" id="sources" hidden><h2 data-i18n="Connect a source"></h2><select id="kind"><option>Xtream</option><option>M3U</option></select><input id="url" type="url" data-placeholder="Server or playlist address" autocomplete="off"><input id="user" data-placeholder="Username" autocomplete="off"><input id="password" type="password" data-placeholder="Password" autocomplete="off"><button onclick="source()" data-i18n="Connect on this TV"></button><p class="muted" data-i18n="Credentials stay on this television. They are excluded from backups and sync."></p></section>
<script type="application/json" id="locale">__I18N__</script>
<script>
const base=location.pathname;let page=0;const el=id=>document.getElementById(id),dictionary=JSON.parse(el('locale').textContent),T=key=>dictionary[key]||key;
for(const element of document.querySelectorAll('[data-i18n]'))element.textContent=T(element.dataset.i18n);
for(const element of document.querySelectorAll('[data-placeholder]'))element.placeholder=T(element.dataset.placeholder);
async function send(data){el('notice').textContent=T('Saving…');try{const r=await fetch(base+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();el('notice').textContent=j.ok?T('Saved. Return to Vela to see your changes.'):j.message;load(0)}catch(e){el('notice').textContent=T('The session has ended. Open a new session in Vela.')}}
function btn(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;return b}
function saveReading(){send({op:'reading',value:Number(el('scale').value)})}
async function load(delta){page=Math.max(0,page+delta);try{const j=await(await fetch(base+'/state?p='+page)).json();el('sources').hidden=!j.full;el('scale').value=j.scale;el('rows').replaceChildren();for(const r of j.rows){const d=document.createElement('div');d.append(btn((r.visible?'✓ ':'')+r.title,()=>send({op:'row',key:r.key})),btn('↑',()=>send({op:'move',key:r.key,direction:-1})),btn('↓',()=>send({op:'move',key:r.key,direction:1})));el('rows').append(d)}el('channels').replaceChildren();for(const c of j.channels)el('channels').append(btn('☆ '+c.name,()=>send({op:'favorite',id:c.id,page})));el('apps').replaceChildren();for(const a of j.apps){const d=document.createElement('div');d.append(btn(a.name,()=>{if(el('folder').value)send({op:'folder',name:el('folder').value,app:a.pkg})}),btn('↑',()=>send({op:'appMove',pkg:a.pkg,direction:-1})),btn('↓',()=>send({op:'appMove',pkg:a.pkg,direction:1})));if(j.full)d.append(btn((j.pinned||[]).includes(a.pkg)?T('Unpin'):T('Pin'),()=>send({op:'pin',pkg:a.pkg})));if((j.pinned||[]).includes(a.pkg))d.append(btn(T('Sidebar ↑'),()=>send({op:'pinMove',pkg:a.pkg,direction:-1})),btn(T('Sidebar ↓'),()=>send({op:'pinMove',pkg:a.pkg,direction:1})));el('apps').append(d)}}catch(e){el('notice').textContent=T('Could not connect to the television.')}}
async function source(){const data={op:'source',kind:el('kind').value,url:el('url').value,user:el('user').value,password:el('password').value};el('password').value='';el('user').value='';el('url').value='';await send(data);data.password=''}load(0);
</script></html>
