# Neutral build defaults. Configure accounts, server, shortcuts and city inside Vela on each TV.
# Normal builds never read config.properties. Legacy private overrides require
# build.ps1 -UseLocalConfig or build.sh --local-config; never share that private APK.

# Optional legacy integration. The cinematic home and both screensavers do not require a TMDB key.
tmdb_key=

# Region for the optional legacy integration; no account or location data.
tmdb_region=US

# Leave neutral. Choose approximate automatic location or a city in the first-run guide or Settings.
latitude=0
longitude=0
city=

# auto (follows the TV), es, en or pt
language=auto

# Crypto prices: USD, BRL, EUR...
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# With disable_apps=true, true also turns off Google Assistant; the remote's mic button stops working.
disable_assistant=false

# Optional package disabling, including the stock launcher and TCL extras.
# false preserves system apps and remote shortcuts; enable only after testing your TV.
disable_apps=false

# Legacy flag. Current home/screensaver weather is controlled by runtime settings.
weather_enabled=false

# Optional HOME component to restore after retiring another launcher. Must match an installed HOME activity.
# Leave blank to capture the current launcher. Example: com.google.android.apps.tv.launcherx/.home.HomeActivity
recovery_home=

# Only for TVs whose factory launcher overrides the chosen home while enabled.
# Journal and disable the validated recovery launcher in Vela mode; Original enables it again.
# Independent of disable_apps: no other packages are affected when disable_apps=false.
isolate_recovery_home=false
