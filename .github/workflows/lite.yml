name: Vela Lite · Build and public checks
on:
  push:
    branches: [main]
    paths: ['lite/**', 'app/res/xml/searchable.xml', 'app/assets/i18n/**', 'app/src/tv/vela/launcher/L10n.java', 'tools/check_localization.py', 'tools/audit_publication.py', 'app/src/tv/vela/launcher/Device*.java', 'app/src/tv/vela/launcher/Vela*.java', 'app/src/io/nayuki/**', 'app/assets/connect.html', 'app/assets/licenses/qr-generator-MIT.txt', 'app/src/tv/vela/launcher/TvInputs.java', 'app/src/tv/vela/launcher/TvTimelineView.java', 'app/src/tv/vela/launcher/UpNextView.java', 'app/src/tv/vela/launcher/TvRemotePress.java', 'app/src/tv/vela/launcher/TvPersonalization.java', 'app/src/tv/vela/launcher/TvChannelOrganizer.java', '.github/workflows/lite.yml']
  pull_request:
    paths: ['lite/**', 'app/res/xml/searchable.xml', 'app/assets/i18n/**', 'app/src/tv/vela/launcher/L10n.java', 'tools/check_localization.py', 'tools/audit_publication.py', 'app/src/tv/vela/launcher/Device*.java', 'app/src/tv/vela/launcher/Vela*.java', 'app/src/io/nayuki/**', 'app/assets/connect.html', 'app/assets/licenses/qr-generator-MIT.txt', 'app/src/tv/vela/launcher/TvInputs.java', 'app/src/tv/vela/launcher/TvTimelineView.java', 'app/src/tv/vela/launcher/UpNextView.java', 'app/src/tv/vela/launcher/TvRemotePress.java', 'app/src/tv/vela/launcher/TvPersonalization.java', 'app/src/tv/vela/launcher/TvChannelOrganizer.java', '.github/workflows/lite.yml']
permissions:
  contents: read
jobs:
  lite:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Audit public source and reviewed screenshots
        run: |
          python tools/audit_publication.py
          python tools/check_localization.py
      - name: Build Lite with an ephemeral CI signing key
        shell: pwsh
        run: ./lite/build.ps1 -SdkPath $env:ANDROID_HOME -JdkPath $env:JAVA_HOME
      - name: Check package, permissions and isolated runtime
        run: python lite/tests/check_package.py
