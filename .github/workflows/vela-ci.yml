name: Build and checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android compile tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
          log-accepted-android-sdk-licenses: false
      - name: Check public files
        run: |
          python3 tools/audit_publication.py
          python3 tools/check_localization.py
      - name: Build neutral APK with an ephemeral local signing key
        run: bash build.sh
      - name: Check recovery, Plex and releases
        run: |
          python3 tests/test_home_mode.py
          python3 tests/test_plex_feed.py
          python3 tests/test_jellyfin_feed.py
          python3 tests/test_updates.py

